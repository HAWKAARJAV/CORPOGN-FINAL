<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#0d2044"/>
    <stop offset="100%" stop-color="#071428"/>
  </radialGradient>
  <radialGradient id="globeGrad" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#1a6fa8"/>
    <stop offset="50%" stop-color="#0d4a7a"/>
    <stop offset="100%" stop-color="#071e3d"/>
  </radialGradient>
  <radialGradient id="globeShine" cx="35%" cy="30%" r="50%">
    <stop offset="0%" stop-color="rgba(100,200,255,0.25)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="800" height="620" fill="url(#bgGrad)"/>

<!-- Subtle background glow -->
<ellipse cx="400" cy="300" rx="280" ry="260" fill="rgba(20,80,160,0.12)"/>

<!-- ═══ GLOBE ═══ -->
<circle cx="400" cy="245" r="168" fill="url(#globeGrad)"/>
<circle cx="400" cy="245" r="168" fill="url(#globeShine)"/>

<!-- Globe grid lines (latitude) -->
<ellipse cx="400" cy="245" rx="168" ry="40" fill="none" stroke="rgba(100,200,255,0.18)" stroke-width="1"/>
<ellipse cx="400" cy="245" rx="168" ry="90" fill="none" stroke="rgba(100,200,255,0.12)" stroke-width="1"/>
<ellipse cx="400" cy="210" rx="148" ry="30" fill="none" stroke="rgba(100,200,255,0.12)" stroke-width="1"/>
<ellipse cx="400" cy="280" rx="148" ry="30" fill="none" stroke="rgba(100,200,255,0.12)" stroke-width="1"/>
<ellipse cx="400" cy="170" rx="110" ry="22" fill="none" stroke="rgba(100,200,255,0.10)" stroke-width="1"/>
<ellipse cx="400" cy="320" rx="110" ry="22" fill="none" stroke="rgba(100,200,255,0.10)" stroke-width="1"/>

<!-- Globe grid lines (longitude) -->
<line x1="400" y1="77" x2="400" y2="413" stroke="rgba(100,200,255,0.18)" stroke-width="1"/>
<line x1="316" y1="90" x2="484" y2="400" stroke="rgba(100,200,255,0.12)" stroke-width="1"/>
<line x1="248" y1="130" x2="552" y2="360" stroke="rgba(100,200,255,0.10)" stroke-width="1"/>
<line x1="484" y1="90" x2="316" y2="400" stroke="rgba(100,200,255,0.12)" stroke-width="1"/>
<line x1="552" y1="130" x2="248" y2="360" stroke="rgba(100,200,255,0.10)" stroke-width="1"/>

<!-- Globe outline -->
<circle cx="400" cy="245" r="168" fill="none" stroke="rgba(100,200,255,0.30)" stroke-width="1.5"/>

<!-- ═══ POLYGON NETWORK OVERLAY ON GLOBE ═══ -->
