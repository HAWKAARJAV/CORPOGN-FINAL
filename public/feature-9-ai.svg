<line x1="430" y1="265" x2="566" y2="334" stroke="#849b34" stroke-width="1.5" opacity="0.4"/>
<!-- Node: NGO Matching (top) -->
<rect x="306" y="48" width="148" height="68" rx="12" fill="#1e293b"/>
<rect x="306" y="48" width="148" height="4" rx="2" fill="#849b34"/>
