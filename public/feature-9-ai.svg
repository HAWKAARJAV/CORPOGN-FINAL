<text x="380" y="250" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">AI</text>
<!-- Connection lines from center to nodes -->
<line x1="380" y1="192" x2="380" y2="120" stroke="#849b34" stroke-width="1.5" opacity="0.4"/>
<line x1="380" y1="288" x2="380" y2="360" stroke="#849b34" stroke-width="1.5" opacity="0.4"/>
