<svg viewBox="0 0 580 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes pulse  { 0%,100%{opacity:.2} 50%{opacity:.07} }
    @keyframes glow   { 0%,100%{opacity:.65} 50%{opacity:1} }
    @keyframes dash   { to{stroke-dashoffset:-32} }
    @keyframes ping   { 0%{r:7;opacity:.85} 100%{r:24;opacity:0} }
    @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes spin   { to{stroke-dashoffset:-60} }
    @keyframes shimmer{ 0%,100%{opacity:.5} 50%{opacity:1} }
    .dash { stroke-dasharray:7 5; animation:dash 2.2s linear infinite; }
    .d2   { stroke-dasharray:7 5; animation:dash 1.8s linear infinite; }
    .d3   { stroke-dasharray:7 5; animation:dash 2.8s linear infinite; }
    .d4   { stroke-dasharray:7 5; animation:dash 2s   linear infinite; }
    .d5   { stroke-dasharray:7 5; animation:dash 2.5s linear infinite; }
    .ring { animation:pulse  4s   ease-in-out infinite; }
    .g1   { animation:glow   2.5s ease-in-out infinite; }
    .g2   { animation:glow   3s   ease-in-out infinite 0.4s; }
    .g3   { animation:glow   2.8s ease-in-out infinite 0.9s; }
    .g4   { animation:glow   3.2s ease-in-out infinite 0.2s; }
    .g5   { animation:glow   2.6s ease-in-out infinite 1.1s; }
    .p1   { animation:ping   2.4s ease-out  infinite; }
    .p2   { animation:ping   2.4s ease-out  infinite 0.8s; }
    .p3   { animation:ping   2.4s ease-out  infinite 1.5s; }
    .hub  { animation:glow   3s   ease-in-out infinite; }
    .orb  { stroke-dasharray:12 8; animation:spin 3s linear infinite; }
    .sh   { animation:shimmer 2.8s ease-in-out infinite; }
    .c1   { animation:float  4s   ease-in-out infinite; }
    .c2   { animation:float  4.5s ease-in-out infinite 0.5s; }
    .c3   { animation:float  5s   ease-in-out infinite 1s; }
    .c4   { animation:float  3.8s ease-in-out infinite 0.3s; }
  </style>

  <linearGradient id="hubG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#3b82f6" stop-opacity=".15"/>
    <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
  </radialGradient>
  <filter id="sh">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".45"/>
  </filter>
  <filter id="gf">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ── Ambient glow behind map ── -->
<ellipse cx="268" cy="255" rx="175" ry="190" fill="url(#mapGlow)"/>

<!-- ══════════════════════════════════════════════════
     INDIA MAP — proper outline
     Scale: x=(lon-80)*8.8+268  y=(25-lat)*9.2+255
     ══════════════════════════════════════════════════ -->
<g opacity=".28" fill="#93c5fd" stroke="#60a5fa" stroke-width="1.3" stroke-linejoin="round">
  <path d="
    M 191,101
    Q 228,84  256,88
    Q 278,86  298,92
    Q 326,98  348,116
    Q 358,128 362,142
    L 404,115
    Q 395,130 390,145
    Q 382,158 375,168
    Q 366,180 354,192
    Q 344,205 334,216
    Q 322,234 314,254
    Q 304,278 294,304
    Q 284,330 272,356
    Q 268,370 264,382
    Q 260,370 256,356
    Q 244,330 234,308
    Q 224,282 218,256
    Q 212,232 210,212
    Q 206,192 200,180
    Q 196,170 192,162
    Q 186,170 182,164
    Q 176,156 172,144
    Q 168,130 172,118
    Q 180,108 191,101
    Z
  "/>
  <!-- Sri Lanka (tiny island) -->
  <ellipse cx="280" cy="398" rx="10" ry="13" opacity=".5"/>
</g>

<!-- ── Concentric rings at hub ── -->
<circle cx="268" cy="255" r="80" fill="none" stroke="rgba(96,165,250,.06)" stroke-width="1" class="ring"/>
<circle cx="268" cy="255" r="55" fill="none" stroke="rgba(96,165,250,.08)" stroke-width="1" class="ring"/>

<!-- ── Connection lines: hub → cities ── -->
<!-- Mumbai -->
<line x1="268" y1="255" x2="196" y2="238" stroke="#60a5fa" stroke-width="1.3" opacity=".5" class="dash"/>
<!-- Delhi -->
<line x1="268" y1="255" x2="236" y2="155" stroke="#34d399" stroke-width="1.3" opacity=".5" class="d2"/>
<!-- Bengaluru -->
<line x1="268" y1="255" x2="254" y2="332" stroke="#c084fc" stroke-width="1.3" opacity=".5" class="d3"/>
<!-- Kolkata -->
<line x1="268" y1="255" x2="336" y2="220" stroke="#fbbf24" stroke-width="1.3" opacity=".5" class="d4"/>
<!-- Chennai -->
<line x1="268" y1="255" x2="272" y2="335" stroke="#22d3ee" stroke-width="1.3" opacity=".5" class="d5"/>

<!-- ── City nodes ── -->
<!-- Delhi (green) -->
<circle class="p2" cx="236" cy="155" r="7" fill="none" stroke="#34d399" stroke-width="1.5" opacity=".45"/>
<circle class="g2" cx="236" cy="155" r="6" fill="#10b981" filter="url(#gf)"/>
<text x="248" y="152" font-size="9.5" fill="rgba(110,231,183,.75)" font-family="Arial,sans-serif" font-weight="600">Delhi</text>

<!-- Mumbai (blue) -->
<circle class="p1" cx="196" cy="238" r="7" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity=".45"/>
<circle class="g1" cx="196" cy="238" r="6" fill="#3b82f6" filter="url(#gf)"/>
<text x="168" y="251" font-size="9.5" fill="rgba(147,197,253,.75)" font-family="Arial,sans-serif" font-weight="600">Mumbai</text>

<!-- Kolkata (amber) -->
<circle class="g4" cx="336" cy="220" r="6" fill="#f59e0b" filter="url(#gf)"/>
<text x="344" y="217" font-size="9.5" fill="rgba(253,230,138,.75)" font-family="Arial,sans-serif" font-weight="600">Kolkata</text>

<!-- Bengaluru (purple) -->
<circle class="p3" cx="254" cy="332" r="7" fill="none" stroke="#c084fc" stroke-width="1.5" opacity=".45"/>
<circle class="g3" cx="254" cy="332" r="6" fill="#a855f7" filter="url(#gf)"/>
<text x="218" y="348" font-size="9.5" fill="rgba(216,180,254,.75)" font-family="Arial,sans-serif" font-weight="600">Bengaluru</text>

<!-- Chennai (cyan, no ping) -->
<circle class="g5" cx="272" cy="335" r="5" fill="#06b6d4" filter="url(#gf)"/>

<!-- Hyderabad (orange, small) -->
<circle class="g4" cx="260" cy="295" r="4" fill="#f97316" filter="url(#gf)"/>

<!-- ══════ CENTRAL HUB ══════ -->
<circle cx="268" cy="255" r="52" fill="rgba(37,99,235,.12)" class="ring"/>
<circle cx="268" cy="255" r="42" fill="url(#hubG)" filter="url(#sh)" class="hub"/>
<!-- Rotating orbit ring -->
<circle cx="268" cy="255" r="48" fill="none" stroke="rgba(147,197,253,.22)" stroke-width="1.5"
        stroke-dasharray="12 8" style="animation:spin 18s linear infinite;transform-origin:268px 255px"/>
<text x="268" y="248" text-anchor="middle" font-size="14.5" font-weight="800" fill="white"
      font-family="'Segoe UI',Arial,sans-serif" letter-spacing=".4" filter="url(#gf)">CorpoGN</text>
<line x1="240" y1="254" x2="296" y2="254" stroke="rgba(255,255,255,.18)" stroke-width=".8"/>
<text x="268" y="265" text-anchor="middle" font-size="6.8" fill="rgba(186,230,255,.82)"
      font-family="Arial,sans-serif" letter-spacing="2">CSR PLATFORM</text>
<text x="268" y="278" text-anchor="middle" font-size="8" fill="rgba(134,239,172,.85)"
      font-family="Arial,sans-serif" class="sh">● AI Powered</text>

<!-- ══════════════════════════════════
     STAT CARDS (right side)
     ══════════════════════════════════ -->

<!-- Card 1: Real-time Funds (top) -->
<g class="c1" filter="url(#sh)">
  <rect x="384" y="68" width="188" height="58" rx="14"
        fill="#1e3a8a" stroke="rgba(96,165,250,.3)" stroke-width="1"/>
  <rect x="384" y="68" width="5"   height="58" rx="2" fill="#3b82f6"/>
  <circle cx="408" cy="97" r="16"  fill="rgba(59,130,246,.25)"/>
  <text x="408" y="103" text-anchor="middle" font-size="14" fill="#93c5fd"
        font-family="Arial,sans-serif" font-weight="700">₹</text>
  <text x="432" y="89"  font-size="11"   font-weight="700" fill="white"
        font-family="'Segoe UI',Arial,sans-serif">Real-time Funds</text>
  <text x="432" y="105" font-size="9"    fill="#93c5fd"
        font-family="Arial,sans-serif">Live disbursement tracking</text>
</g>

<!-- Card 2: NGO Partners -->
<g class="c2" filter="url(#sh)">
  <rect x="390" y="160" width="182" height="70" rx="14"
        fill="#064e3b" stroke="rgba(52,211,153,.28)" stroke-width="1"/>
  <rect x="390" y="160" width="5"   height="70" rx="2" fill="#10b981"/>
  <circle cx="414" cy="195" r="16"  fill="rgba(16,185,129,.25)"/>
  <circle cx="414" cy="190" r="5"   fill="#34d399"/>
  <path d="M406,205 Q414,200 422,205" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="436" y="184" font-size="22" font-weight="800" fill="white"
        font-family="'Segoe UI',Arial,sans-serif">500+</text>
  <text x="436" y="200" font-size="10" font-weight="600" fill="#6ee7b7"
        font-family="Arial,sans-serif">NGO Partners</text>
  <text x="436" y="215" font-size="8.5" fill="rgba(167,243,208,.7)"
        font-family="Arial,sans-serif">Verified &amp; onboarded</text>
</g>

<!-- Card 3: CSR Projects -->
<g class="c3" filter="url(#sh)">
  <rect x="390" y="264" width="182" height="70" rx="14"
        fill="#3b0764" stroke="rgba(167,139,250,.28)" stroke-width="1"/>
  <rect x="390" y="264" width="5"   height="70" rx="2" fill="#8b5cf6"/>
  <circle cx="414" cy="299" r="16"  fill="rgba(139,92,246,.25)"/>
  <rect x="406" y="291" width="4"   height="10" rx="1" fill="#a78bfa"/>
  <rect x="412" y="287" width="4"   height="14" rx="1" fill="#c4b5fd"/>
  <rect x="418" y="284" width="4"   height="17" rx="1" fill="#ddd6fe"/>
  <text x="436" y="288" font-size="22" font-weight="800" fill="white"
        font-family="'Segoe UI',Arial,sans-serif">1200+</text>
  <text x="436" y="304" font-size="10" font-weight="600" fill="#c4b5fd"
        font-family="Arial,sans-serif">CSR Projects</text>
  <text x="436" y="319" font-size="8.5" fill="rgba(221,214,254,.7)"
        font-family="Arial,sans-serif">Tracked &amp; reported</text>
</g>

<!-- Card 4: Schedule VII -->
<g class="c4" filter="url(#sh)">
  <rect x="390" y="368" width="182" height="68" rx="14"
        fill="#451a03" stroke="rgba(251,191,36,.28)" stroke-width="1"/>
  <rect x="390" y="368" width="5"   height="68" rx="2" fill="#f59e0b"/>
  <circle cx="414" cy="402" r="16"  fill="rgba(245,158,11,.22)"/>
  <path d="M414,392 L424,396 L424,404 Q424,411 414,415 Q404,411 404,404 L404,396 Z"
        fill="#fbbf24" opacity=".9"/>
  <text x="414" y="408" text-anchor="middle" font-size="7.5" fill="white"
        font-weight="800" font-family="Arial,sans-serif">VII</text>
  <text x="436" y="392" font-size="11"   font-weight="700" fill="white"
        font-family="'Segoe UI',Arial,sans-serif">Schedule VII</text>
  <text x="436" y="407" font-size="10"   font-weight="600" fill="#fcd34d"
        font-family="Arial,sans-serif">100% Compliant</text>
  <text x="436" y="421" font-size="8.5"  fill="rgba(253,230,138,.7)"
        font-family="Arial,sans-serif">Auto-mapped &amp; filed</text>
</g>

</svg>
