<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480">
<rect width="760" height="480" rx="16" fill="#0f172a"/>
<!-- Background circles -->
<circle cx="380" cy="240" r="300" fill="none" stroke="rgba(132,155,52,0.06)" stroke-width="60"/>
<circle cx="380" cy="240" r="200" fill="none" stroke="rgba(132,155,52,0.08)" stroke-width="1"/>
<circle cx="380" cy="240" r="140" fill="none" stroke="rgba(132,155,52,0.10)" stroke-width="1"/>
<defs><filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="ai-sh"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.5"/></filter></defs>
<!-- Central AI brain -->
<circle cx="380" cy="240" r="52" fill="#121e56" filter="url(#ai-sh)"/>
<circle cx="380" cy="240" r="46" fill="none" stroke="#849b34" stroke-width="2" opacity="0.6"/>
