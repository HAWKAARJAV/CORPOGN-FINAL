<svg viewBox="0 0 580 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes glow   { 0%,100%{opacity:.65} 50%{opacity:1} }
    @keyframes dash   { to{stroke-dashoffset:-32} }
    @keyframes ping   { 0%{r:7;opacity:.8} 100%{r:22;opacity:0} }
    @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes spin   { to{stroke-dashoffset:-60} }
    @keyframes shimmer{ 0%,100%{opacity:.45} 50%{opacity:.95} }
    @keyframes pulse  { 0%,100%{opacity:.15} 50%{opacity:.05} }
    .dash{stroke-dasharray:7 5;animation:dash 2.2s linear infinite}
    .d2  {stroke-dasharray:7 5;animation:dash 1.8s linear infinite}
    .d3  {stroke-dasharray:7 5;animation:dash 2.8s linear infinite}
    .d4  {stroke-dasharray:7 5;animation:dash 2s   linear infinite}
    .d5  {stroke-dasharray:7 5;animation:dash 2.5s linear infinite}
    .g1  {animation:glow   2.5s ease-in-out infinite}
    .g2  {animation:glow   3s   ease-in-out infinite 0.4s}
    .g3  {animation:glow   2.8s ease-in-out infinite 0.9s}
    .g4  {animation:glow   3.2s ease-in-out infinite 0.2s}
    .g5  {animation:glow   2.6s ease-in-out infinite 1.1s}
    .p1  {animation:ping   2.4s ease-out  infinite}
    .p2  {animation:ping   2.4s ease-out  infinite 0.8s}
    .p3  {animation:ping   2.4s ease-out  infinite 1.5s}
    .hub {animation:glow   3s   ease-in-out infinite}
    .sh  {animation:shimmer 2.8s ease-in-out infinite}
    .rng {animation:pulse  4s   ease-in-out infinite}
    .c1  {animation:float  4s   ease-in-out infinite}
    .c2  {animation:float  4.5s ease-in-out infinite 0.5s}
    .c3  {animation:float  5s   ease-in-out infinite 1s}
    .c4  {animation:float  3.8s ease-in-out infinite 0.3s}
  </style>
  <radialGradient id="mg" cx="46%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#3b82f6" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hubG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="gf"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<ellipse cx="210" cy="228" rx="162" ry="182" fill="url(#mg)"/>

<!--
  INDIA MAP — single clean clockwise path (verified, no backtracking)
  Projection: x=(lon-68)*8.2+100   y=(37.5-lat)*10.2+62
  Sequence: start Pakistan-Gujarat → N along Pakistan border → E along China/Nepal → NE states → S east coast → tip → N west coast → Saurashtra bump → Rann → close
-->
<g fill="#93c5fd" stroke="#60a5fa" stroke-width="1.5"
   stroke-linejoin="round" stroke-linecap="round" opacity=".3">

  <path d="
    M 100,200
    Q 108,174 116,148
    Q 126,128 145,110
    L 147,88 145,67
    Q 160,62 174,62
    Q 186,67 195,72
    Q 202,82 190,108
    Q 194,120 202,139
    Q 220,150 264,164
    L 275,166 275,172
    Q 286,167 296,163
    L 338,154 338,165
    Q 330,173 325,179
    Q 318,188 317,192
    Q 310,204 305,215
    Q 297,218 293,222
    Q 282,226 276,226
    Q 264,228 255,234
    Q 242,248 228,262
    Q 212,276 199,298
    Q 200,316 200,328
    Q 190,346 177,362
    Q 169,357 164,340
    Q 158,320 148,290
    Q 140,262 138,232
    Q 128,225 116,222
    Q 111,216 110,210
    Q 113,200 119,198
    Q 128,196 136,198
    L 104,196
    Z
  "/>

  <!-- Sri Lanka -->
  <ellipse cx="190" cy="382" rx="8" ry="12" opacity=".6"/>
</g>

<!-- Rings around hub -->
<circle cx="198" cy="222" r="72"  fill="none" stroke="rgba(96,165,250,.06)" stroke-width="1" class="rng"/>
<circle cx="198" cy="222" r="48"  fill="none" stroke="rgba(96,165,250,.08)" stroke-width="1" class="rng"/>

<!-- Connection lines -->
<line x1="198" y1="222" x2="140" y2="256" stroke="#60a5fa"  stroke-width="1.3" opacity=".55" class="dash"/>
<line x1="198" y1="222" x2="186" y2="152" stroke="#34d399"  stroke-width="1.3" opacity=".55" class="d2"/>
<line x1="198" y1="222" x2="206" y2="332" stroke="#c084fc"  stroke-width="1.3" opacity=".55" class="d3"/>
<line x1="198" y1="222" x2="268" y2="215" stroke="#fbbf24"  stroke-width="1.3" opacity=".55" class="d4"/>
<line x1="198" y1="222" x2="199" y2="335" stroke="#22d3ee"  stroke-width="1.3" opacity=".5"  class="d5"/>

<!-- Delhi -->
<circle class="p2" cx="186" cy="152" r="7" fill="none" stroke="#34d399" stroke-width="1.5" opacity=".4"/>
<circle class="g2" cx="186" cy="152" r="6" fill="#10b981" filter="url(#gf)"/>
<text x="196" y="149" font-size="9.5" fill="rgba(110,231,183,.85)" font-family="Arial,sans-serif" font-weight="600">Delhi</text>

<!-- Mumbai -->
<circle class="p1" cx="140" cy="256" r="7" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity=".4"/>
<circle class="g1" cx="140" cy="256" r="6" fill="#3b82f6" filter="url(#gf)"/>
<text x="106" y="270" font-size="9.5" fill="rgba(147,197,253,.85)" font-family="Arial,sans-serif" font-weight="600">Mumbai</text>

<!-- Kolkata -->
<circle class="g4" cx="268" cy="215" r="6" fill="#f59e0b" filter="url(#gf)"/>
<text x="276" y="212" font-size="9.5" fill="rgba(253,230,138,.85)" font-family="Arial,sans-serif" font-weight="600">Kolkata</text>

<!-- Bengaluru -->
<circle class="p3" cx="206" cy="332" r="7" fill="none" stroke="#c084fc" stroke-width="1.5" opacity=".4"/>
<circle class="g3" cx="206" cy="332" r="6" fill="#a855f7" filter="url(#gf)"/>
<text x="172" y="348" font-size="9.5" fill="rgba(216,180,254,.85)" font-family="Arial,sans-serif" font-weight="600">Bengaluru</text>

<!-- Chennai -->
<circle class="g5" cx="199" cy="335" r="5" fill="#06b6d4" filter="url(#gf)"/>
<!-- Hyderabad -->
<circle class="g4" cx="199" cy="290" r="4" fill="#f97316" filter="url(#gf)"/>

<!-- Hub -->
<circle cx="198" cy="222" r="48" fill="rgba(37,99,235,.12)" class="rng"/>
<circle cx="198" cy="222" r="38" fill="url(#hubG)" filter="url(#sh)" class="hub"/>
<circle cx="198" cy="222" r="44" fill="none" stroke="rgba(147,197,253,.22)" stroke-width="1.5"
        stroke-dasharray="11 7" style="animation:spin 18s linear infinite;transform-origin:198px 222px"/>
<text x="198" y="215" text-anchor="middle" font-size="13" font-weight="800" fill="white"
      font-family="'Segoe UI',Arial,sans-serif" letter-spacing=".4" filter="url(#gf)">CorpoGN</text>
<line x1="174" y1="221" x2="222" y2="221" stroke="rgba(255,255,255,.18)" stroke-width=".8"/>
<text x="198" y="231" text-anchor="middle" font-size="6.5" fill="rgba(186,230,255,.82)"
      font-family="Arial,sans-serif" letter-spacing="2">CSR PLATFORM</text>
<text x="198" y="244" text-anchor="middle" font-size="8" fill="rgba(134,239,172,.9)"
      font-family="Arial,sans-serif" class="sh">● AI Powered</text>

<!-- Stat Cards -->
<g class="c1" filter="url(#sh)">
  <rect x="374" y="52"  width="198" height="58" rx="14" fill="#1e3a8a" stroke="rgba(96,165,250,.3)" stroke-width="1"/>
  <rect x="374" y="52"  width="5"   height="58" rx="2"  fill="#3b82f6"/>
  <circle cx="398" cy="81" r="16" fill="rgba(59,130,246,.25)"/>
  <text x="398" y="87" text-anchor="middle" font-size="14" fill="#93c5fd" font-family="Arial,sans-serif" font-weight="700">₹</text>
  <text x="422" y="73"  font-size="11" font-weight="700" fill="white" font-family="'Segoe UI',Arial,sans-serif">Real-time Funds</text>
  <text x="422" y="89"  font-size="8.5" fill="#93c5fd" font-family="Arial,sans-serif">Live disbursement tracking</text>
</g>

<g class="c2" filter="url(#sh)">
  <rect x="380" y="150" width="192" height="72" rx="14" fill="#064e3b" stroke="rgba(52,211,153,.28)" stroke-width="1"/>
  <rect x="380" y="150" width="5"   height="72" rx="2"  fill="#10b981"/>
  <circle cx="404" cy="186" r="16" fill="rgba(16,185,129,.25)"/>
  <circle cx="404" cy="181" r="5" fill="#34d399"/>
  <path d="M396,196 Q404,191 412,196" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="426" y="175" font-size="22" font-weight="800" fill="white" font-family="'Segoe UI',Arial,sans-serif">500+</text>
  <text x="426" y="193" font-size="10" font-weight="600" fill="#6ee7b7" font-family="Arial,sans-serif">NGO Partners</text>
  <text x="426" y="207" font-size="8.5" fill="rgba(167,243,208,.7)" font-family="Arial,sans-serif">Verified &amp; onboarded</text>
</g>

<g class="c3" filter="url(#sh)">
  <rect x="380" y="262" width="192" height="72" rx="14" fill="#3b0764" stroke="rgba(167,139,250,.28)" stroke-width="1"/>
  <rect x="380" y="262" width="5"   height="72" rx="2"  fill="#8b5cf6"/>
  <circle cx="404" cy="298" r="16" fill="rgba(139,92,246,.25)"/>
  <rect x="396" y="290" width="4" height="10" rx="1" fill="#a78bfa"/>
  <rect x="402" y="286" width="4" height="14" rx="1" fill="#c4b5fd"/>
  <rect x="408" y="283" width="4" height="17" rx="1" fill="#ddd6fe"/>
  <text x="426" y="287" font-size="22" font-weight="800" fill="white" font-family="'Segoe UI',Arial,sans-serif">1200+</text>
  <text x="426" y="305" font-size="10" font-weight="600" fill="#c4b5fd" font-family="Arial,sans-serif">CSR Projects</text>
  <text x="426" y="319" font-size="8.5" fill="rgba(221,214,254,.7)" font-family="Arial,sans-serif">Tracked &amp; reported</text>
</g>

<g class="c4" filter="url(#sh)">
  <rect x="380" y="372" width="192" height="70" rx="14" fill="#451a03" stroke="rgba(251,191,36,.28)" stroke-width="1"/>
  <rect x="380" y="372" width="5"   height="70" rx="2"  fill="#f59e0b"/>
  <circle cx="404" cy="407" r="16" fill="rgba(245,158,11,.22)"/>
  <path d="M404,397 L414,401 L414,409 Q414,416 404,420 Q394,416 394,409 L394,401 Z" fill="#fbbf24" opacity=".9"/>
  <text x="404" y="413" text-anchor="middle" font-size="7.5" fill="white" font-weight="800" font-family="Arial,sans-serif">VII</text>
  <text x="426" y="396" font-size="11" font-weight="700" fill="white" font-family="'Segoe UI',Arial,sans-serif">Schedule VII</text>
  <text x="426" y="412" font-size="10" font-weight="600" fill="#fcd34d" font-family="Arial,sans-serif">100% Compliant</text>
  <text x="426" y="426" font-size="8.5" fill="rgba(253,230,138,.7)" font-family="Arial,sans-serif">Auto-mapped &amp; filed</text>
</g>

</svg>
