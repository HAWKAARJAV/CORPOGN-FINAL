<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="CSR strategy governance dashboard illustration">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#020b22"/>
      <stop offset=".46" stop-color="#08265f"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fdff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#c7e4ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#25bfd2"/>
      <stop offset="1" stop-color="#0b5fa8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#4fb8ff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#031334" flood-opacity=".26"/>
    </filter>
    <style>
      .float-slow{animation:floatSlow 7s ease-in-out infinite}
      .float-mid{animation:floatMid 5.5s ease-in-out infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .dash{stroke-dasharray:8 12;animation:dash 16s linear infinite}
      .bar{transform-origin:bottom;animation:bar 4s ease-in-out infinite}
      .bar:nth-child(2){animation-delay:-.7s}
      .bar:nth-child(3){animation-delay:-1.3s}
      .bar:nth-child(4){animation-delay:-2s}
      .bar:nth-child(5){animation-delay:-2.6s}
      @keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes floatMid{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
      @keyframes pulse{0%,100%{opacity:.58;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes dash{to{stroke-dashoffset:-220}}
      @keyframes bar{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1)}}
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
