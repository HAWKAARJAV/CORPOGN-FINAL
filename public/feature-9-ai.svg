<circle cx="380" cy="160" r="4" fill="#849b34" filter="url(#glow)" opacity="0.9"/>
<circle cx="284" cy="178" r="4" fill="#849b34" filter="url(#glow)" opacity="0.9"/>
<circle cx="476" cy="178" r="4" fill="#849b34" filter="url(#glow)" opacity="0.9"/>
