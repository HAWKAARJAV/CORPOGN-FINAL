<svg viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
  <defs>
    <style>
      @keyframes pulse  { 0%,100%{opacity:.15} 50%{opacity:.04} }
      @keyframes glow   { 0%,100%{opacity:.7;r:6} 50%{opacity:1;r:9} }
      @keyframes flow   { to{stroke-dashoffset:-36} }
      @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes spin   { to{transform:rotate(360deg)} }
      @keyframes badge  { 0%,100%{opacity:.9;transform:scale(1)} 50%{opacity:1;transform:scale(1.04)} }
      @keyframes ping   { 0%{transform:scale(1);opacity:.8} 100%{transform:scale(2.2);opacity:0} }
      @keyframes scanline { 0%{transform:translateY(-100%);opacity:0} 30%{opacity:.6} 70%{opacity:.6} 100%{transform:translateY(400%);opacity:0} }

      .nd { animation:pulse 3.5s ease-in-out infinite; }
      .gn { animation:glow  2.8s ease-in-out infinite; }
      .gn2{ animation:glow  3.4s ease-in-out infinite .6s; }
      .gn3{ animation:glow  3s   ease-in-out infinite 1.1s; }
      .gn4{ animation:glow  2.6s ease-in-out infinite 0.4s; }
      .gn5{ animation:glow  3.2s ease-in-out infinite 0.9s; }
      .ln { stroke-dasharray:8 6; animation:flow 2.2s linear infinite; }
      .ln2{ stroke-dasharray:8 6; animation:flow 2.7s linear infinite; }
      .ln3{ stroke-dasharray:8 6; animation:flow 1.9s linear infinite; }
      .ln4{ stroke-dasharray:8 6; animation:flow 2.5s linear infinite; }
      .ln5{ stroke-dasharray:8 6; animation:flow 2s   linear infinite; }
      .bd { animation:badge 3s  ease-in-out infinite; }
      .bd2{ animation:badge 3.6s ease-in-out infinite .4s; }
      .bd3{ animation:badge 4s  ease-in-out infinite .8s; }
      .bd4{ animation:badge 3.3s ease-in-out infinite 1.1s; }
      .fl { animation:float 4s  ease-in-out infinite; }
      .fl2{ animation:float 4.5s ease-in-out infinite .7s; }
      .pg { animation:ping  2s  ease-out infinite; }
      .pg2{ animation:ping  2s  ease-out infinite .9s; }
      .scan{ animation:scanline 5s ease-in-out infinite; }
    </style>

    <!-- Dark navy gradient for central hub -->
    <linearGradient id="hubG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0c1a6b"/>
    </linearGradient>
    <!-- Corporate node - royal blue -->
    <linearGradient id="gCorp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- NGO node - emerald -->
    <linearGradient id="gNGO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <!-- Government node - amber -->
    <linearGradient id="gGov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Finance node - violet -->
    <linearGradient id="gFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <!-- Impact node - cyan -->
    <linearGradient id="gImp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <!-- AI glow -->
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#60a5fa" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>
    <!-- Card background -->
    <linearGradient id="cardG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>

    <filter id="sh">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="gf">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gf2">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scanClip">
      <rect x="148" y="60" width="264" height="360"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND GRID (subtle) ── -->
  <g opacity=".07" stroke="#60a5fa" stroke-width=".5">
    <line x1="80"  y1="0"   x2="80"  y2="480"/>
    <line x1="160" y1="0"   x2="160" y2="480"/>
    <line x1="240" y1="0"   x2="240" y2="480"/>
    <line x1="320" y1="0"   x2="320" y2="480"/>
    <line x1="400" y1="0"   x2="400" y2="480"/>
    <line x1="480" y1="0"   x2="480" y2="480"/>
    <line x1="0"   y1="80"  x2="560" y2="80"/>
    <line x1="0"   y1="160" x2="560" y2="160"/>
    <line x1="0"   y1="240" x2="560" y2="240"/>
    <line x1="0"   y1="320" x2="560" y2="320"/>
    <line x1="0"   y1="400" x2="560" y2="400"/>
  </g>

  <!-- ── INDIA MAP SILHOUETTE (watermark) ── -->
  <g opacity=".09" fill="#93c5fd" stroke="#60a5fa" stroke-width="1">
    <path d="M240,55 L262,50 L286,55 L312,68 L330,88 L336,112 L330,138
             L338,162 L344,196 L340,228 L328,259 L308,288 L282,316
             L262,340 L250,324 L232,300 L210,272 L192,242 L178,210
             L171,178 L174,148 L165,122 L168,94 L186,72 Z"/>
    <!-- Tip of India -->
    <path d="M262,340 L274,358 L262,375 L250,358 Z" opacity=".7"/>
    <!-- Kashmir rough outline -->
    <path d="M240,55 L230,42 L242,35 L262,38 L278,35 L290,42 L286,55" opacity=".5"/>
  </g>

  <!-- ── SCAN LINE (AI scanning effect) ── -->
  <g clip-path="url(#scanClip)">
    <rect class="scan" x="148" y="60" width="264" height="18"
          fill="url(#aiGlow)" opacity=".4"/>
  </g>

  <!-- ── CONCENTRIC RINGS around center ── -->
  <circle cx="280" cy="220" r="170" fill="none" stroke="rgba(96,165,250,.08)"  stroke-width="1"/>
  <circle cx="280" cy="220" r="130" fill="none" stroke="rgba(96,165,250,.07)"  stroke-width="1"/>
  <circle cx="280" cy="220" r="90"  fill="none" stroke="rgba(96,165,250,.1)"   stroke-width="1"/>

  <!-- ── AI GLOW behind center ── -->
  <circle cx="280" cy="220" r="80" fill="url(#aiGlow)" opacity=".6"/>

  <!-- ── CONNECTING LINES ── -->
  <!-- Corp → Center -->
  <line x1="280" y1="220" x2="155" y2="90"  stroke="#3b82f6" stroke-width="1.5" opacity=".55" class="ln"/>
  <!-- NGO → Center -->
  <line x1="280" y1="220" x2="430" y2="95"  stroke="#10b981" stroke-width="1.5" opacity=".55" class="ln2"/>
  <!-- Gov → Center -->
  <line x1="280" y1="220" x2="100" y2="260" stroke="#f59e0b" stroke-width="1.5" opacity=".55" class="ln3"/>
  <!-- Fin → Center -->
  <line x1="280" y1="220" x2="460" y2="265" stroke="#8b5cf6" stroke-width="1.5" opacity=".55" class="ln4"/>
  <!-- Impact → Center -->
  <line x1="280" y1="220" x2="280" y2="395" stroke="#06b6d4" stroke-width="1.5" opacity=".55" class="ln5"/>

  <!-- ── PING RINGS on key nodes ── -->
  <circle class="pg"  cx="155" cy="90"  r="28" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity=".5"/>
  <circle class="pg2" cx="430" cy="95"  r="28" fill="none" stroke="#10b981" stroke-width="1.5" opacity=".5"/>

  <!-- ═══ NODE: Corporate / PSU (top-left) ═══ -->
  <circle cx="155" cy="90"  r="44" fill="rgba(59,130,246,.12)" class="nd"/>
  <circle cx="155" cy="90"  r="33" fill="url(#gCorp)" filter="url(#sh)" class="gn"/>
  <!-- building icon -->
  <g transform="translate(140,76)" fill="white" opacity=".95">
    <rect x="2"  y="10" width="26" height="11" rx="2"/>
    <rect x="5"  y="4"  width="7"  height="6"  rx="1"/>
    <rect x="17" y="4"  width="7"  height="6"  rx="1"/>
    <rect x="4"  y="12" width="4"  height="5"/>
    <rect x="13" y="12" width="4"  height="5"/>
    <rect x="22" y="12" width="4"  height="5"/>
  </g>
  <text x="155" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#93c5fd" font-family="Arial,sans-serif">Corporate / PSU</text>

  <!-- ═══ NODE: NGO Partner (top-right) ═══ -->
  <circle cx="430" cy="95"  r="44" fill="rgba(16,185,129,.12)" class="nd"/>
  <circle cx="430" cy="95"  r="33" fill="url(#gNGO)" filter="url(#sh)" class="gn2"/>
  <!-- heart-hands icon -->
  <g transform="translate(415,80)" fill="white" opacity=".95">
    <path d="M15,2 C15,2 4,7 4,15 C4,21 9,25 15,27 C21,25 26,21 26,15 C26,7 15,2 15,2Z"/>
    <rect x="13" y="25" width="4"  height="6" rx="1"/>
  </g>
  <text x="430" y="145" text-anchor="middle" font-size="10" font-weight="700" fill="#6ee7b7" font-family="Arial,sans-serif">NGO Partner</text>

  <!-- ═══ NODE: Government (left) ═══ -->
  <circle cx="100" cy="260" r="40" fill="rgba(245,158,11,.12)" class="nd"/>
  <circle cx="100" cy="260" r="30" fill="url(#gGov)" filter="url(#sh)" class="gn3"/>
  <!-- shield icon -->
  <g transform="translate(87,247)" fill="white" opacity=".95">
    <path d="M13,0 L26,5 L26,14 Q26,22 13,27 Q0,22 0,14 L0,5 Z" opacity=".9"/>
    <path d="M13,4 L22,8 L22,14 Q22,19 13,23 Q4,19 4,14 L4,8 Z" fill="rgba(245,158,11,.4)"/>
    <text x="13" y="19" text-anchor="middle" font-size="8" font-weight="800" fill="white" font-family="Arial,sans-serif">GOI</text>
  </g>
  <text x="100" y="305" text-anchor="middle" font-size="10" font-weight="700" fill="#fcd34d" font-family="Arial,sans-serif">Government</text>

  <!-- ═══ NODE: Finance (right) ═══ -->
  <circle cx="460" cy="265" r="40" fill="rgba(139,92,246,.12)" class="nd"/>
  <circle cx="460" cy="265" r="30" fill="url(#gFin)" filter="url(#sh)" class="gn4"/>
  <text x="460" y="274" text-anchor="middle" font-size="26" font-weight="700" fill="white" font-family="Arial,sans-serif">₹</text>
  <text x="460" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#c4b5fd" font-family="Arial,sans-serif">Fund Tracking</text>

  <!-- ═══ NODE: Impact (bottom-center) ═══ -->
  <circle cx="280" cy="395" r="40" fill="rgba(6,182,212,.12)" class="nd"/>
  <circle cx="280" cy="395" r="30" fill="url(#gImp)" filter="url(#sh)" class="gn5"/>
  <!-- chart bars -->
  <g transform="translate(265,381)" fill="white" opacity=".95">
    <rect x="0"  y="12" width="5"  height="9"  rx="1"/>
    <rect x="7"  y="7"  width="5"  height="14" rx="1"/>
    <rect x="14" y="3"  width="5"  height="18" rx="1"/>
    <rect x="21" y="6"  width="5"  height="15" rx="1"/>
    <line x1="0" y1="22" x2="27" y2="22" stroke="rgba(255,255,255,.5)" stroke-width="1.2"/>
  </g>
  <text x="280" y="440" text-anchor="middle" font-size="10" font-weight="700" fill="#67e8f9" font-family="Arial,sans-serif">Impact Reporting</text>

  <!-- ═══ CENTRAL HUB ═══ -->
  <circle cx="280" cy="220" r="68" fill="rgba(30,64,175,.15)"/>
  <circle cx="280" cy="220" r="56" fill="url(#hubG)" filter="url(#gf)"/>
  <!-- spinning ring -->
  <circle cx="280" cy="220" r="62" fill="none" stroke="rgba(96,165,250,.25)" stroke-width="1.5"
          stroke-dasharray="12 6" style="animation:spin 18s linear infinite;transform-origin:280px 220px"/>
  <text x="280" y="211" text-anchor="middle" font-size="15" font-weight="800" fill="white"
        font-family="Arial,sans-serif" letter-spacing=".5" filter="url(#gf2)">CorpoGN</text>
  <line x1="244" y1="218" x2="316" y2="218" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
  <text x="280" y="231" text-anchor="middle" font-size="7.5" fill="rgba(186,230,255,.85)"
        font-family="Arial,sans-serif" letter-spacing="1.8">CSR PLATFORM</text>
  <text x="280" y="247" text-anchor="middle" font-size="9" fill="rgba(163,230,255,.7)"
        font-family="Arial,sans-serif" style="animation:glow 2s ease-in-out infinite">AI Powered</text>

  <!-- ═══ FLOATING BADGE 1 — Schedule VII (top-left float) ═══ -->
  <g class="fl" filter="url(#sh)">
    <rect x="6" y="148" width="118" height="40" rx="20" fill="rgba(15,20,60,.85)" stroke="rgba(96,165,250,.3)" stroke-width="1"/>
    <circle cx="26" cy="168" r="14" fill="#1d4ed8"/>
    <text x="26" y="172.5" text-anchor="middle" font-size="8.5" fill="white" font-weight="800" font-family="Arial,sans-serif">VII</text>
    <text x="76" y="164" text-anchor="middle" font-size="9.5" font-weight="700" fill="white" font-family="Arial,sans-serif">Schedule VII</text>
    <text x="76" y="177" text-anchor="middle" font-size="8"   fill="#93c5fd" font-family="Arial,sans-serif">Compliant</text>
  </g>

  <!-- ═══ FLOATING BADGE 2 — AI Matching (top-right float) ═══ -->
  <g class="fl2" filter="url(#sh)">
    <rect x="400" y="165" width="110" height="40" rx="20" fill="rgba(15,20,60,.85)" stroke="rgba(139,92,246,.3)" stroke-width="1"/>
    <circle cx="419" cy="185" r="14" fill="#7c3aed"/>
    <text x="419" y="189.5" text-anchor="middle" font-size="9" fill="white" font-weight="700" font-family="Arial,sans-serif">AI</text>
    <text x="463" y="181" text-anchor="middle" font-size="9.5" font-weight="700" fill="white" font-family="Arial,sans-serif">AI Matching</text>
    <text x="463" y="194" text-anchor="middle" font-size="8"   fill="#c4b5fd" font-family="Arial,sans-serif">Proposals</text>
  </g>

  <!-- ═══ FLOATING BADGE 3 — GIS Need Map (bottom-left) ═══ -->
  <g class="fl" filter="url(#sh)">
    <rect x="8" y="330" width="112" height="40" rx="20" fill="rgba(15,20,60,.85)" stroke="rgba(245,158,11,.3)" stroke-width="1"/>
    <circle cx="27" cy="350" r="14" fill="#d97706"/>
    <text x="27" y="354.5" text-anchor="middle" font-size="8" fill="white" font-weight="700" font-family="Arial,sans-serif">GIS</text>
    <text x="72" y="346" text-anchor="middle" font-size="9.5" font-weight="700" fill="white" font-family="Arial,sans-serif">Need Map</text>
    <text x="72" y="359" text-anchor="middle" font-size="8"   fill="#fcd34d" font-family="Arial,sans-serif">Assessment</text>
  </g>

  <!-- ═══ FLOATING BADGE 4 — BRSR & GRI (bottom-right) ═══ -->
  <g class="fl2" filter="url(#sh)">
    <rect x="420" y="335" width="110" height="40" rx="20" fill="rgba(15,20,60,.85)" stroke="rgba(16,185,129,.3)" stroke-width="1"/>
    <circle cx="439" cy="355" r="14" fill="#059669"/>
    <text x="439" y="359.5" text-anchor="middle" font-size="7.5" fill="white" font-weight="700" font-family="Arial,sans-serif">GRI</text>
    <text x="483" y="351" text-anchor="middle" font-size="9.5" font-weight="700" fill="white" font-family="Arial,sans-serif">BRSR &amp; GRI</text>
    <text x="483" y="364" text-anchor="middle" font-size="8"   fill="#6ee7b7" font-family="Arial,sans-serif">Reporting</text>
  </g>

  <!-- ═══ STAT PILL — top center ═══ -->
  <g class="fl" filter="url(#sh)">
    <rect x="210" y="10" width="140" height="34" rx="17" fill="rgba(15,20,60,.9)" stroke="rgba(96,165,250,.35)" stroke-width="1"/>
    <circle cx="227" cy="27" r="11" fill="#1d4ed8"/>
    <text x="227" y="31" text-anchor="middle" font-size="10" fill="white" font-weight="800" font-family="Arial,sans-serif">₹</text>
    <text x="293" y="23" text-anchor="middle" font-size="8.5" font-weight="700" fill="white" font-family="Arial,sans-serif">Real-time Funds</text>
    <text x="293" y="35" text-anchor="middle" font-size="7.5" fill="#93c5fd" font-family="Arial,sans-serif">Disbursement Tracking</text>
  </g>
</svg>
