<svg viewBox="0 0 580 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes glow   { 0%,100%{opacity:.65} 50%{opacity:1} }
    @keyframes dash   { to{stroke-dashoffset:-32} }
    @keyframes ping   { 0%{r:7;opacity:.8} 100%{r:22;opacity:0} }
    @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes spin   { to{stroke-dashoffset:-60} }
    @keyframes shimmer{ 0%,100%{opacity:.45} 50%{opacity:.9} }
    @keyframes pulse  { 0%,100%{opacity:.15} 50%{opacity:.05} }
    .dash{stroke-dasharray:7 5;animation:dash 2.2s linear infinite}
    .d2  {stroke-dasharray:7 5;animation:dash 1.8s linear infinite}
    .d3  {stroke-dasharray:7 5;animation:dash 2.8s linear infinite}
    .d4  {stroke-dasharray:7 5;animation:dash 2s   linear infinite}
    .d5  {stroke-dasharray:7 5;animation:dash 2.5s linear infinite}
    .g1  {animation:glow 2.5s ease-in-out infinite}
    .g2  {animation:glow 3s   ease-in-out infinite 0.4s}
    .g3  {animation:glow 2.8s ease-in-out infinite 0.9s}
    .g4  {animation:glow 3.2s ease-in-out infinite 0.2s}
    .g5  {animation:glow 2.6s ease-in-out infinite 1.1s}
    .p1  {animation:ping 2.4s ease-out  infinite}
    .p2  {animation:ping 2.4s ease-out  infinite 0.8s}
    .p3  {animation:ping 2.4s ease-out  infinite 1.5s}
    .hub {animation:glow 3s   ease-in-out infinite}
    .sh  {animation:shimmer 2.8s ease-in-out infinite}
    .rng {animation:pulse 4s  ease-in-out infinite}
    .c1  {animation:float 4s   ease-in-out infinite}
    .c2  {animation:float 4.5s ease-in-out infinite 0.5s}
    .c3  {animation:float 5s   ease-in-out infinite 1s}
    .c4  {animation:float 3.8s ease-in-out infinite 0.3s}
  </style>
  <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#3b82f6" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hubG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="gf"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Ambient glow -->
<ellipse cx="220" cy="230" rx="170" ry="190" fill="url(#mapGlow)"/>

<!--
  INDIA MAP — proper outline
  Projection: x = (lon-68)*8 + 110,  y = (37.5-lat)*10.5 + 65
  Going clockwise from Pakistan-Gujarat (Rann of Kutch) border
-->
<g opacity=".3" fill="#93c5fd" stroke="#60a5fa" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
  <path d="
    M 110,211
    Q 122,197 130,161
    Q 140,141 150,129
    Q 156,119 160,109
    Q 156,97  152,87
    Q 158,76  178,65
    Q 190,72  202,81
    Q 210,94  216,107
    Q 218,120 218,134
    Q 214,140 210,145
    Q 238,156 274,171
    Q 279,172 284,174
    Q 286,179 288,182
    Q 292,185 296,187
    Q 302,176 308,166
    Q 322,162 342,160
    Q 342,168 340,176
    Q 336,183 330,192
    Q 324,200 320,208
    Q 314,216 310,224
    Q 307,215 302,213
    Q 302,221 302,229
    Q 294,232 286,234
    Q 282,229 278,224
    Q 274,229 270,234
    Q 266,241 264,248
    Q 256,254 248,258
    Q 240,265 232,273
    Q 226,282 220,292
    Q 214,306 212,318
    Q 210,332 210,344
    Q 202,360 190,375
    Q 183,371 178,355
    Q 174,340 174,334
    Q 168,320 162,298
    Q 157,281 154,266
    Q 151,258 150,240
    Q 144,239 138,239
    Q 132,233 128,228
    Q 133,223 139,218
    Q 146,214 152,212
    Q 144,210 134,217
    Q 122,213 110,211
    Z
  "/>
  <!-- Sri Lanka -->
  <ellipse cx="198" cy="392" rx="8" ry="11" opacity=".55"/>
  <!-- Andaman (far SE, small dot) -->
  <ellipse cx="310" cy="352" rx="5" ry="14" opacity=".35"/>
</g>

<!-- Concentric rings at hub -->
<circle cx="222" cy="222" r="75" fill="none" stroke="rgba(96,165,250,.06)" stroke-width="1" class="rng"/>
<circle cx="222" cy="222" r="50" fill="none" stroke="rgba(96,165,250,.08)" stroke-width="1" class="rng"/>

<!-- Connection lines hub → cities -->
<line x1="222" y1="222" x2="152" y2="259" stroke="#60a5fa" stroke-width="1.3" opacity=".55" class="dash"/><!-- Mumbai -->
<line x1="222" y1="222" x2="186" y2="158" stroke="#34d399" stroke-width="1.3" opacity=".55" class="d2"/><!-- Delhi -->
<line x1="222" y1="222" x2="210" y2="332" stroke="#c084fc" stroke-width="1.3" opacity=".55" class="d3"/><!-- Bengaluru -->
<line x1="222" y1="222" x2="278" y2="224" stroke="#fbbf24" stroke-width="1.3" opacity=".55" class="d4"/><!-- Kolkata -->
<line x1="222" y1="222" x2="214" y2="335" stroke="#22d3ee" stroke-width="1.3" opacity=".5"  class="d5"/><!-- Chennai -->

<!-- City dots -->
<!-- Delhi (green) -->
<circle class="p2" cx="186" cy="158" r="7" fill="none" stroke="#34d399" stroke-width="1.5" opacity=".4"/>
<circle class="g2" cx="186" cy="158" r="6" fill="#10b981" filter="url(#gf)"/>
<text x="196" y="155" font-size="9.5" fill="rgba(110,231,183,.8)" font-family="Arial,sans-serif" font-weight="600">Delhi</text>

<!-- Mumbai (blue) -->
<circle class="p1" cx="152" cy="259" r="7" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity=".4"/>
<circle class="g1" cx="152" cy="259" r="6" fill="#3b82f6" filter="url(#gf)"/>
<text x="120" y="272" font-size="9.5" fill="rgba(147,197,253,.8)" font-family="Arial,sans-serif" font-weight="600">Mumbai</text>

<!-- Kolkata (amber) -->
<circle class="g4" cx="278" cy="224" r="6" fill="#f59e0b" filter="url(#gf)"/>
<text x="286" y="221" font-size="9.5" fill="rgba(253,230,138,.8)" font-family="Arial,sans-serif" font-weight="600">Kolkata</text>

<!-- Bengaluru (purple) -->
<circle class="p3" cx="210" cy="332" r="7" fill="none" stroke="#c084fc" stroke-width="1.5" opacity=".4"/>
<circle class="g3" cx="210" cy="332" r="6" fill="#a855f7" filter="url(#gf)"/>
<text x="176" y="348" font-size="9.5" fill="rgba(216,180,254,.8)" font-family="Arial,sans-serif" font-weight="600">Bengaluru</text>

<!-- Chennai (cyan) -->
<circle class="g5" cx="214" cy="335" r="5" fill="#06b6d4" filter="url(#gf)"/>

<!-- Hyderabad (orange) -->
<circle class="g4" cx="210" cy="290" r="4" fill="#f97316" filter="url(#gf)"/>

<!-- CorpoGN Hub -->
<circle cx="222" cy="222" r="50" fill="rgba(37,99,235,.12)" class="rng"/>
<circle cx="222" cy="222" r="40" fill="url(#hubG)" filter="url(#sh)" class="hub"/>
<circle cx="222" cy="222" r="46" fill="none" stroke="rgba(147,197,253,.22)" stroke-width="1.5"
        stroke-dasharray="11 7" style="animation:spin 18s linear infinite;transform-origin:222px 222px"/>
<text x="222" y="215" text-anchor="middle" font-size="13.5" font-weight="800" fill="white"
      font-family="'Segoe UI',Arial,sans-serif" letter-spacing=".4" filter="url(#gf)">CorpoGN</text>
<line x1="197" y1="221" x2="247" y2="221" stroke="rgba(255,255,255,.18)" stroke-width=".8"/>
<text x="222" y="231" text-anchor="middle" font-size="6.5" fill="rgba(186,230,255,.82)"
      font-family="Arial,sans-serif" letter-spacing="2">CSR PLATFORM</text>
<text x="222" y="244" text-anchor="middle" font-size="8" fill="rgba(134,239,172,.88)"
      font-family="Arial,sans-serif" class="sh">● AI Powered</text>

<!-- ═══════ STAT CARDS ═══════ -->

<!-- Card 1: Real-time Funds -->
<g class="c1" filter="url(#sh)">
  <rect x="378" y="58" width="194" height="58" rx="14" fill="#1e3a8a" stroke="rgba(96,165,250,.3)" stroke-width="1"/>
  <rect x="378" y="58" width="5" height="58" rx="2" fill="#3b82f6"/>
  <circle cx="402" cy="87" r="16" fill="rgba(59,130,246,.25)"/>
  <text x="402" y="93" text-anchor="middle" font-size="14" fill="#93c5fd" font-family="Arial,sans-serif" font-weight="700">₹</text>
  <text x="426" y="79" font-size="11" font-weight="700" fill="white" font-family="'Segoe UI',Arial,sans-serif">Real-time Funds</text>
  <text x="426" y="95" font-size="8.5" fill="#93c5fd" font-family="Arial,sans-serif">Live disbursement tracking</text>
</g>

<!-- Card 2: NGO Partners -->
<g class="c2" filter="url(#sh)">
  <rect x="384" y="154" width="188" height="72" rx="14" fill="#064e3b" stroke="rgba(52,211,153,.28)" stroke-width="1"/>
  <rect x="384" y="154" width="5" height="72" rx="2" fill="#10b981"/>
  <circle cx="408" cy="190" r="16" fill="rgba(16,185,129,.25)"/>
  <circle cx="408" cy="185" r="5" fill="#34d399"/>
  <path d="M400,200 Q408,195 416,200" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="430" y="179" font-size="22" font-weight="800" fill="white" font-family="'Segoe UI',Arial,sans-serif">500+</text>
  <text x="430" y="196" font-size="10" font-weight="600" fill="#6ee7b7" font-family="Arial,sans-serif">NGO Partners</text>
  <text x="430" y="210" font-size="8.5" fill="rgba(167,243,208,.7)" font-family="Arial,sans-serif">Verified &amp; onboarded</text>
</g>

<!-- Card 3: CSR Projects -->
<g class="c3" filter="url(#sh)">
  <rect x="384" y="264" width="188" height="72" rx="14" fill="#3b0764" stroke="rgba(167,139,250,.28)" stroke-width="1"/>
  <rect x="384" y="264" width="5" height="72" rx="2" fill="#8b5cf6"/>
  <circle cx="408" cy="300" r="16" fill="rgba(139,92,246,.25)"/>
  <rect x="400" y="292" width="4" height="10" rx="1" fill="#a78bfa"/>
  <rect x="406" y="288" width="4" height="14" rx="1" fill="#c4b5fd"/>
  <rect x="412" y="285" width="4" height="17" rx="1" fill="#ddd6fe"/>
  <text x="430" y="289" font-size="22" font-weight="800" fill="white" font-family="'Segoe UI',Arial,sans-serif">1200+</text>
  <text x="430" y="306" font-size="10" font-weight="600" fill="#c4b5fd" font-family="Arial,sans-serif">CSR Projects</text>
  <text x="430" y="320" font-size="8.5" fill="rgba(221,214,254,.7)" font-family="Arial,sans-serif">Tracked &amp; reported</text>
</g>

<!-- Card 4: Schedule VII -->
<g class="c4" filter="url(#sh)">
  <rect x="384" y="374" width="188" height="70" rx="14" fill="#451a03" stroke="rgba(251,191,36,.28)" stroke-width="1"/>
  <rect x="384" y="374" width="5" height="70" rx="2" fill="#f59e0b"/>
  <circle cx="408" cy="409" r="16" fill="rgba(245,158,11,.22)"/>
  <path d="M408,399 L418,403 L418,411 Q418,418 408,422 Q398,418 398,411 L398,403 Z" fill="#fbbf24" opacity=".9"/>
  <text x="408" y="415" text-anchor="middle" font-size="7.5" fill="white" font-weight="800" font-family="Arial,sans-serif">VII</text>
  <text x="430" y="398" font-size="11" font-weight="700" fill="white" font-family="'Segoe UI',Arial,sans-serif">Schedule VII</text>
  <text x="430" y="414" font-size="10" font-weight="600" fill="#fcd34d" font-family="Arial,sans-serif">100% Compliant</text>
  <text x="430" y="428" font-size="8.5" fill="rgba(253,230,138,.7)" font-family="Arial,sans-serif">Auto-mapped &amp; filed</text>
</g>

</svg>
