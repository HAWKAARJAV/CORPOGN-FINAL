<text x="380" y="90" font-family="system-ui,sans-serif" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle">AI finds best-fit NGOs</text>
<text x="380" y="104" font-family="system-ui,sans-serif" font-size="8" fill="#849b34" text-anchor="middle">96% match accuracy</text>
